<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <form novalidate>
      <label for="name-of-the-place">Name of the Place</label>
      <input type="text" class="name-of-the-place" name="name-of-the-place" id="name-of-the-place" required/>
      <input type="checkbox" class="fahrenheit-or-celsius-toggle" id="celsius">Get results in Fahrenheit
      </input>
      <button class="submit-btn">Submit</button>
      <span class="error-message"></span>
    </form>

  </body>
</html>
